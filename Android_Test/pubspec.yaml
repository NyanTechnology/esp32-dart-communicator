name: nyaneyes_tester
description: A minimal functional tester for NyanEyes BLE and HTTP communication.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.2
  nsd: ^5.0.1
  file_picker: ^13.1.0
  http: ^1.2.1
  image: ^4.1.3
  esp32_comm:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  nsd_android:
    path: ../../nsd_android

flutter:
  uses-material-design: true
